# To generate this file:
#
#   kubectl create secret generic cloudflared-token \
#     --namespace infra \
#     --from-literal=token=<YOUR_TUNNEL_TOKEN> \
#     --dry-run=client -o yaml \
#   | kubeseal \
#     --controller-namespace sealed-secrets \
#     --controller-name sealed-secrets-controller \
#     --format yaml \
#   > k8s/infra/cloudflared/sealed-secret.yaml
#
# Get the tunnel token from: Cloudflare Zero Trust → Networks → Tunnels → your tunnel → Configure → token
#
# PLACEHOLDER — replace this file with the real sealed secret before deploying.
