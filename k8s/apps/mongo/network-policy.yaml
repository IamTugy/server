apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: mongo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: recipes-api
        - podSelector:
            matchLabels:
              app: mongo-backup
      ports:
        - port: 27017
          protocol: TCP
