apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: apps
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      # A hard kill mid-write is what corrupted the WiredTiger data files
      # last time (5-day undetected crash-loop, fixed with `mongod --repair`).
      # Give mongod real time to flush and close cleanly instead of racing
      # the default 30s grace period.
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:7
          # Authorization is enforced from here on - the admin/app/readonly
          # users were created manually before this flag was added (auth
          # must be off to create the very first user). Any further users
          # must be created as an authenticated admin from now on.
          args: ["--auth"]
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-admin
                  key: password
          lifecycle:
            preStop:
              exec:
                # Explicit clean shutdown rather than relying solely on SIGTERM -
                # waits for an active checkpoint before exiting. Needs auth
                # now that --auth is on, or this silently fails and we're
                # back to the hard-kill corruption risk this hook exists to
                # prevent.
                command: ["sh", "-c", "mongosh --quiet -u admin -p \"$MONGO_ADMIN_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({shutdown: 1, force: false})'"]
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
