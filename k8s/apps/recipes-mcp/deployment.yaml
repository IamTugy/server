apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipes-mcp
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipes-mcp
  template:
    metadata:
      labels:
        app: recipes-mcp
    spec:
      containers:
        - name: mcp
          image: tugy/recipes-mcp:sha-a473f03
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: RECIPES_API_BASE_URL
              value: http://recipes-api.apps.svc.cluster.local:80
            - name: RECIPES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-mcp-apikey
                  key: apiKey
            - name: REDIS_URL
              value: redis://redis.apps.svc.cluster.local:6379
            - name: MCP_PUBLIC_URL
              value: https://mcp.tugy.dev
            - name: CLERK_FRONTEND_API
              value: https://clerk.tugy.dev
            - name: CLERK_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: recipes-mcp-oauth
                  key: clerkOAuthClientId
            - name: CLERK_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: recipes-mcp-oauth
                  key: clerkOAuthClientSecret
            - name: MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-jwt-secret
                  key: secret
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
