apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: recipes-mcp
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: recipes-mcp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: recipes-api
      ports:
        - port: 80
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
