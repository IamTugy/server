apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipes-api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipes-api
  template:
    metadata:
      labels:
        app: recipes-api
    spec:
      initContainers:
        # Best-effort populate of the `recipes` Mongo collection from the YAML
        # recipe data baked into the image at /app/recipe-data. The seed script
        # exits 0 even when seeding fails, so a bad seed never blocks startup.
        - name: seed-recipes
          image: tugy/recipes-api:sha-4f8c7e4
          imagePullPolicy: Always
          command: ["node", "dist/recipes/seed-recipes.js"]
          env:
            - name: MONGO_URI
              value: mongodb://mongo.apps.svc.cluster.local:27017/recipes
            - name: RECIPE_DATA_DIR
              value: ./recipe-data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: api
          image: tugy/recipes-api:sha-4f8c7e4
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: MONGO_URI
              value: mongodb://mongo.apps.svc.cluster.local:27017/recipes
            - name: REDIS_URL
              value: redis://redis.apps.svc.cluster.local:6379
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-api-clerk
                  key: secretKey
            - name: R2_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: recipes-api-r2
                  key: accessKeyId
            - name: R2_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-api-r2
                  key: secretAccessKey
            - name: R2_ENDPOINT
              value: https://0fa1fdc4fabc9fb72b70343462afa977.r2.cloudflarestorage.com
            - name: R2_BUCKET
              value: recipes-assets
            - name: R2_PUBLIC_URL
              value: https://recipes-assets.tugy.dev
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: recipes-api-github
                  key: token
            - name: GITHUB_REPO
              value: IamTugy/recipes
            - name: OWNER_USER_ID
              value: user_3HHok7VTx8lyXObDglJRi71DU6C
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
