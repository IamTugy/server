apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipes-api
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipes-api
  template:
    metadata:
      labels:
        app: recipes-api
    spec:
      initContainers:
        # Best-effort populate of the `recipes` Mongo collection from the YAML
        # recipe data baked into the image at /app/recipe-data. The seed script
        # exits 0 even when seeding fails, so a bad seed never blocks startup.
        - name: seed-recipes
          image: tugy/recipes-api:sha-a1e2553
          command: ["node", "dist/recipes/seed-recipes.js"]
          env:
            - name: MONGO_URI
              value: mongodb://mongo.apps.svc.cluster.local:27017/recipes
            - name: RECIPE_DATA_DIR
              value: ./recipe-data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: api
          image: tugy/recipes-api:sha-a1e2553
          ports:
            - containerPort: 80
          env:
            - name: MONGO_URI
              value: mongodb://mongo.apps.svc.cluster.local:27017/recipes
            - name: REDIS_URL
              value: redis://redis.apps.svc.cluster.local:6379
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: recipes-api-clerk
                  key: secretKey
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
