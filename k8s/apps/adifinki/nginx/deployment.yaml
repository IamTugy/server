apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: adifinki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: tugy/adifinki-nginx:sha-50e0b51
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
