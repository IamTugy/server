---
# Allow nginx to receive from Traefik and proxy to backends
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx
  namespace: adifinki
spec:
  podSelector:
    matchLabels:
      app: nginx
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: portfolio
      ports:
        - port: 8002
    - to:
        - podSelector:
            matchLabels:
              app: market-data
      ports:
        - port: 8001
    - to:
        - podSelector:
            matchLabels:
              app: risk
      ports:
        - port: 8003
---
# Allow portfolio to talk to postgres (in apps ns) and redis
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portfolio
  namespace: adifinki
spec:
  podSelector:
    matchLabels:
      app: portfolio
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
          podSelector:        # AND: only postgresql pod in apps namespace
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
---
# Allow market-data to be called by nginx, fetch external market data
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-data
  namespace: adifinki
spec:
  podSelector:
    matchLabels:
      app: market-data
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
---
# Allow risk to be called by nginx
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk
  namespace: adifinki
spec:
  podSelector:
    matchLabels:
      app: risk
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nginx
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - port: 6379
    - ports:
        - port: 443
---
# Allow redis to receive from portfolio and risk only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
  namespace: adifinki
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: portfolio
        - podSelector:
            matchLabels:
              app: risk
