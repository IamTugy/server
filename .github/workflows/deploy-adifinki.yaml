name: Deploy adifinki

on:
  workflow_dispatch:
    inputs:
      market_data_image:
        required: true
      portfolio_image:
        required: true
      risk_image:
        required: true
      nginx_image:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags
        run: |
          sed -i "s|image: tugy/adifinki-market-data:.*|image: ${{ github.event.inputs.market_data_image }}|" k8s/apps/adifinki/market-data/deployment.yaml
          sed -i "s|image: tugy/adifinki-portfolio:.*|image: ${{ github.event.inputs.portfolio_image }}|" k8s/apps/adifinki/portfolio/deployment.yaml
          sed -i "s|image: tugy/adifinki-risk:.*|image: ${{ github.event.inputs.risk_image }}|" k8s/apps/adifinki/risk/deployment.yaml
          sed -i "s|image: tugy/adifinki-nginx:.*|image: ${{ github.event.inputs.nginx_image }}|" k8s/apps/adifinki/nginx/deployment.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/adifinki/
          git diff --cached --quiet || git commit -m "deploy: bump adifinki to ${{ github.sha }}"
          git push

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifests
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_REMOTE }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig.yaml
          chmod 600 /tmp/kubeconfig.yaml
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl apply -f k8s/apps/adifinki/ --recursive
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl rollout status deployment/nginx -n adifinki --timeout=120s
