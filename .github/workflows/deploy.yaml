name: Deploy

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: "App name (must match k8s/apps/<name>/)"
        required: true
      image:
        description: "Full image reference (e.g. tugy/tech:sha-abc1234)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tag in manifest
        run: |
          APP=${{ github.event.inputs.application_name }}
          IMAGE=${{ github.event.inputs.image }}
          sed -i "s|image: tugy/${APP}:.*|image: ${IMAGE}|" k8s/apps/${APP}/deployment.yaml
          echo "Updated k8s/apps/${APP}/deployment.yaml to ${IMAGE}"

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/apps/${{ github.event.inputs.application_name }}/deployment.yaml
          git diff --cached --quiet || git commit -m "deploy: bump ${{ github.event.inputs.application_name }} to ${{ github.event.inputs.image }}"
          git push

      - name: Connect Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Apply manifests
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_REMOTE }}
        run: |
          echo "$KUBECONFIG_DATA" | base64 -d > /tmp/kubeconfig.yaml
          chmod 600 /tmp/kubeconfig.yaml
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl apply -f k8s/apps/${{ github.event.inputs.application_name }}/
          KUBECONFIG=/tmp/kubeconfig.yaml kubectl rollout status deployment/${{ github.event.inputs.application_name }} \
            -n apps --timeout=120s
